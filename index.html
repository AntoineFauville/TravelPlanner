<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelPlanner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f6f84'/%3E%3Cpath d='M15 6v15H7zM17 9l8 12h-8zM6 23h20l-3 4H9z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="travel">
<canvas id="stars" aria-hidden="true"></canvas>
<div id="map"></div>

<header id="top">
  <h1>TravelPlanner</h1>
  <nav id="nav">
    <button data-view="discover">Discover</button>
    <button data-view="catalogue">Catalogue</button>
    <button data-view="travel">Travel</button>
    <button data-view="holidays">Holidays</button>
    <button data-view="sailing" aria-label="Sailing world tour"><span class="lng">Sailing world tour</span><span class="sht">World tour</span></button>
  </nav>
  <div id="who" role="group" aria-label="Who is rating"></div>
  <button id="menuBtn">Settings</button>
</header>

<aside id="panel"></aside>
<aside id="detail" hidden></aside>
<main id="discover" hidden></main>
<main id="catalogue" hidden></main>
<dialog id="settings"></dialog>
<div id="legend"></div>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
